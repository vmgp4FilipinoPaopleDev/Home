<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaraOkify Android</title>
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', Arial, sans-serif;
      background: linear-gradient(135deg, #1a237e, #00c853, #64dd17);
      color: #fff; /* default text color */
      text-align: center;
    }

    header {
      padding: 30px 20px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
    }

    h1 {
      font-size: 2.5rem;
      margin: 0;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }

    /* Logo text colors */
    .kara { color: #ff5252; }   /* red accent */
    .oki { color: #40c4ff; }    /* cyan accent */
    .fy {
      background: linear-gradient(90deg, #c6ff00, #00e676);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin: 30px 0;
    }

    nav a button {
      padding: 14px 22px;
      border: none;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
    }

    nav a button:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.05);
    }

    .highlight {
      background: linear-gradient(90deg, #00e676, #c6ff00);
      color: #000;
      font-weight: bold;
    }

    .tutorial {
      margin: 30px auto;
      max-width: 600px;
      background: rgba(0,0,0,0.6);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
    }

    .tutorial h2 {
      margin-bottom: 15px;
      color: #00e676;
    }

    /* Responsive video wrapper */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 ratio */
    }

    .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
    }

    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      nav a button { font-size: 0.9rem; padding: 10px 15px; }
    }

    @media (min-width: 1200px) {
      h1 { font-size: 3rem; }
      nav a button { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>
      🤖 <span class="kara">Kara</span><span class="oki">Oki</span><span class="fy">fy</span> Android 🎶
    </h1>
    <p>Sing anywhere — Android phone, tablet, or TV</p>
  </header>

  <nav>
    <a href="karaokify_android_policy.html" target="_blank">
      <button>Privacy Policy</button>
    </a>
    <a href="remote_tutorial.html" target="_blank"><button>Remote to Device</button></a>
    <a href="settings_tutorial.html" target="_blank"><button>Karaoke Settings</button></a>
    <a href="favorites_tutorial.html" target="_blank"><button>My Favorites</button></a>
    <a href="search_tutorial.html" target="_blank"><button class="highlight">CLICK to Start Search Song</button></a>
    <a href="playlist_tutorial.html" target="_blank"><button>Next Song to Playlist</button></a>
  </nav>

  <div class="tutorial">
    <h2>📺 How to Use KaraOkify Android</h2>
    
    <!-- Button to show video -->
    <button id="showVideoBtn" style="
      padding: 12px 20px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(90deg, #00e676, #c6ff00);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s;
    ">
      ▶ Watch Video Tutorial
    </button>

    <!-- Hidden video -->
    <div id="videoContainer" style="display:none; margin-top:20px;">
      <div class="video-wrapper">
        <video controls>
          <source src="image/KaraOkify Tutorial.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("showVideoBtn").addEventListener("click", function() {
      document.getElementById("videoContainer").style.display = "block";
      this.style.display = "none"; // hide button once clicked
    });
  </script>
</body>
</html>
