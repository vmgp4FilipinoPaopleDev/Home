<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KaraOkify</title>
  <style>
    :root{
      --accent:#ff4081;
      --overlay-rgba: rgba(0,0,0,0.45);
    }

    *{box-sizing:border-box;margin:0;padding:0}

    html,body{height:100%}

    /* Full page background */
    body{
      font-family: Arial, sans-serif;
      color:#fff;
      background:
        linear-gradient(var(--overlay-rgba), var(--overlay-rgba)),
        url('image/karaokify_full.jpg') no-repeat center center / cover;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      text-align:center;
    }

    /* Optional fixed background effect, respects reduced motion */
    @media (prefers-reduced-motion: no-preference){
      body{
        background-attachment: fixed;
      }
    }

    header{
      width:100%;
      max-width:1200px;
      padding:48px 20px;
    }

    header h1{
      font-size:clamp(1.6rem,4vw,3rem);
      margin-bottom:8px;
      text-shadow:2px 2px 8px rgba(0,0,0,0.7);
    }

    header p{
      font-size:clamp(0.95rem,1.6vw,1.15rem);
      opacity:0.95;
      margin:0 auto;
      max-width:900px;
    }

    main{width:100%;max-width:1100px;padding:36px 20px}

    section{margin-bottom:36px}

    section h2{color:var(--accent);font-size:1.6rem;margin-bottom:16px}

    img.screenshot{
      max-width:80%;
      border:4px solid var(--accent);
      border-radius:10px;
      display:block;
      margin:0 auto;
    }

    footer{
      width:100%;
      background:rgba(0,0,0,0.45);
      padding:18px 20px;
      margin-top:auto;
    }

    footer a{color:var(--accent);text-decoration:none}

    /* Mobile tweaks */
    @media (max-width:600px){
      header{padding:28px 12px}
      main{padding:24px 12px}
      img.screenshot{max-width:95%}
    }
  </style>
</head>
<body>
  <header>
    <h1>About KaraOkify</h1>
    <p>KaraOkify brings the fun of karaoke to your mobile device with vibrant visuals and smooth performance.</p>
  </header>

  <main>
    <section>
      <h2>App Screenshot</h2>
      <img src="Karaokify_asc1.png" alt="KaraOkify Main Menu" class="screenshot">
      <img src="Karaokify_asc2.png" alt="KaraOkify Remote to another Device screen" class="screenshot">
    </section>

    <section>
      <h2>Tutorial</h2>
      <p>Watch how to use KaraOkify:</p>
      <a href="https://www.youtube.com/your-tutorial-link" target="_blank" rel="noopener noreferrer">▶ KaraOkify Intro</a>
    </section>
  </main>

  <footer>
    <a href="privacy.html">Privacy Policy</a>
  </footer>
</body>
</html>
