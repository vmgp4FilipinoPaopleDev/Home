<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Favorites Tutorial – KaraOkify</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #6a1b9a, #f06292, #ff9800);
      color: #fff;
      text-align: center;
    }

    header {
      padding: 25px 20px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2rem;
      margin: 0;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }

    .tutorial {
      margin: 30px auto;
      max-width: 600px;
      background: rgba(0,0,0,0.5);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
    }

    .tutorial h2 {
      margin-bottom: 15px;
      color: #ffd700;
    }

    /* Responsive video wrapper */
    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 ratio */
    }

    .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
    }

    @media (max-width: 768px) {
      h1 { font-size: 1.6rem; }
    }

    @media (min-width: 1200px) {
      h1 { font-size: 2.4rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>⭐ KaraOkify – Favorites Tutorial 🎶</h1>
  </header>

  <div class="tutorial">
    <h2>📺 How to Manage Your Favorites</h2>
    <div class="video-wrapper">
      <video controls>
        <source src="videos/favorites_demo.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </div>
</body>
</html>
